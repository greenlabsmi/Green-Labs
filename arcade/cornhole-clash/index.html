<!doctype html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--green:#00e58b;--gold:#f3c957;--cyan:#28e7ff;--pink:#ff4f9a;--purple:#7653c9;--red:#ff4e5b;--ink:#050707;--cream:#fff7df;--pixel:'Press Start 2P',monospace;--arcade:'VT323',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;overscroll-behavior:none;touch-action:none;user-select:none;font-family:Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer}.hidden{display:none!important}
#app{position:relative;width:min(100vw,720px);height:100dvh;margin:auto;overflow:hidden;background:#06110c;isolation:isolate;box-shadow:0 0 80px #00e58b22}.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}.scan{position:absolute;inset:0;z-index:90;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,#fff0 0 3px,#fff2 4px);mix-blend-mode:overlay}.vignette{position:absolute;inset:0;z-index:89;pointer-events:none;box-shadow:inset 0 0 90px #000c}
#title{align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));text-align:center;background:radial-gradient(circle at 50% 24%,#542080 0,#10193a 34%,#06130e 69%,#000);overflow-y:auto}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#28e7ff 1px,transparent 1px),radial-gradient(#ff4f9a 1px,transparent 1px);background-size:43px 43px,73px 73px,101px 101px;background-position:0 0,20px 30px,50px 12px;opacity:.35;animation:stars 18s linear infinite}@keyframes stars{to{background-position:0 300px,20px 430px,50px 550px}}
.cabinet{position:relative;width:100%;max-width:660px;padding:24px 18px;border:4px solid var(--green);background:linear-gradient(#0b1711f2,#020403fa);box-shadow:0 0 0 7px #000,0 0 40px #00e58b77,10px 14px 0 #351f65}.kicker{font:10px/1.6 var(--pixel);color:var(--cyan);letter-spacing:.05em}.logo-mark{margin:10px auto 8px;width:74px;height:74px;border:5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:24px var(--pixel);color:var(--green);box-shadow:inset 0 0 20px #00e58b66,0 0 22px #f3c95755}.main-title{margin:14px 0 6px;font:clamp(38px,10vw,72px)/.98 var(--pixel);letter-spacing:-.07em;color:var(--cream);text-shadow:0 5px #101426,5px 9px var(--purple),-3px -3px var(--cyan)}.main-title b{display:block;color:var(--gold);font-weight:inherit}.tag{margin:15px auto;max-width:540px;font-size:clamp(17px,4.4vw,23px);font-weight:900;line-height:1.35;color:#dfe9e3}.feature-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.feature{padding:11px 5px;border:2px solid #20352a;background:#0b140f;font-size:12px;font-weight:900;line-height:1.25}.feature span{display:block;font-size:24px;margin-bottom:5px}.arcade-btn{width:100%;min-height:62px;border:4px solid #000;background:linear-gradient(#ffe36b,#bf7911);color:#170d00;font-weight:1000;letter-spacing:.06em;box-shadow:0 8px #603800,0 0 25px #f3c95788}.arcade-btn:active{transform:translateY(6px);box-shadow:0 2px #603800}.small-btn{margin-top:16px;border:0;background:none;color:#aebbb3;font-weight:900;text-decoration:underline}.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
#game{flex-direction:column;background:#07100c}.hud{height:104px;flex:0 0 auto;padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:#020403;border-bottom:3px solid var(--gold);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;z-index:3}.fighter{display:grid;grid-template-columns:44px 1fr;gap:7px;align-items:center}.fighter.cpu{grid-template-columns:1fr 44px;text-align:right}.avatar{width:44px;height:44px;border:3px solid #000;outline:2px solid var(--green);background:#15251b;position:relative;overflow:hidden}.avatar:before{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#d7a777;left:10px;top:5px}.avatar:after{content:'';position:absolute;width:31px;height:25px;border-radius:12px 12px 0 0;background:var(--green);left:4px;top:25px}.cpu .avatar{outline-color:var(--pink)}.cpu .avatar:after{background:var(--pink)}.name{font:clamp(8px,2vw,11px)/1.3 var(--pixel)}.round-score{font:26px var(--arcade);color:var(--gold)}.meter{height:8px;margin-top:4px;background:#263029;border:1px solid #000;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .2s}.cpu .meter i{margin-left:auto;background:linear-gradient(90deg,var(--purple),var(--pink))}.versus{text-align:center}.inning{font:9px/1.4 var(--pixel);color:#fff}.turn{margin-top:6px;font:18px var(--arcade);color:var(--cyan)}
#arena{position:relative;flex:1;min-height:0;overflow:hidden;background:#0c2940}canvas{display:block;width:100%;height:100%}.message{position:absolute;left:50%;top:12%;transform:translate(-50%,-50%) scale(.7);width:90%;text-align:center;pointer-events:none;opacity:0;font:clamp(22px,7vw,46px)/1 var(--pixel);color:var(--cream);text-shadow:4px 4px #000,6px 6px var(--purple);z-index:6}.message.pop{animation:pop 1.15s steps(5)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
.controls{height:151px;flex:0 0 auto;padding:9px 10px max(10px,env(safe-area-inset-bottom));background:#030605;border-top:3px solid var(--green);z-index:4}.instruction{text-align:center;height:25px;font-weight:1000;font-size:13px;color:#d6e1da}.control-row{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:stretch;height:94px}.special,.curve{border:2px solid #314139;background:#101813;font:9px/1.35 var(--pixel);padding:5px}.special.ready{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px #f3c95755;animation:ready .65s steps(2) infinite}@keyframes ready{50%{filter:brightness(1.6)}}.special.active{background:var(--gold);color:#171000}.throw-box{position:relative;border:3px solid var(--gold);background:#111914;overflow:hidden}.power-fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:linear-gradient(0deg,#ff4e5b,#f3c957 58%,#00e58b);opacity:.8}.throw-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:12px/1.5 var(--pixel);text-shadow:2px 2px #000;z-index:2}.curve strong{display:block;color:var(--cyan);font:19px var(--arcade)}
#results{align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));background:radial-gradient(circle,#401773,#08150f 58%,#000);text-align:center}.result-title{font:clamp(40px,10vw,72px)/1 var(--pixel);color:var(--gold);text-shadow:5px 6px #4a3286}.final-card{margin:18px 0;padding:18px;border:3px solid var(--green);background:#07100b}.final-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.final-grid div{padding:14px;background:#ffffff09}.final-grid b{display:block;font:38px var(--arcade);color:var(--gold)}.final-grid span{font:9px var(--pixel)}.secondary{margin-top:14px;background:#111914;color:#fff;border-color:#33423a;box-shadow:0 7px #000}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:8px;height:18px;top:-30px;background:var(--c);animation:fall var(--d) linear infinite;animation-delay:var(--delay)}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(800deg)}}
@media(max-width:430px){.cabinet{padding:20px 12px}.feature-row{gap:5px}.feature{font-size:10px}.hud{height:96px}.fighter{grid-template-columns:38px 1fr}.fighter.cpu{grid-template-columns:1fr 38px}.avatar{width:38px;height:38px}.avatar:before{left:8px}.avatar:after{left:2px}.controls{height:143px}.control-row{height:88px;grid-template-columns:64px 1fr 64px}.special,.curve{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>

<body>
<main id="app">
 <section id="title" class="screen active"><div class="stars"></div><div class="cabinet"><div class="kicker">GREEN LABS ARCADE · GAME 03</div><div class="logo-mark">GL</div><h1 class="main-title">CORNHOLE <b>CLASH</b></h1><p class="tag">Backyard rules. Arcade physics. Absolutely unnecessary special moves.</p><div class="feature-row"><div class="feature"><span>🎯</span>SKILL SHOTS</div><div class="feature"><span>⚡</span>CLASH MOVES</div><div class="feature"><span>🏆</span>CPU BATTLE</div></div><button id="start" class="arcade-btn"><span class="blink">▶ PRESS START</span></button><button id="arcadeBack" class="small-btn">← GREEN LABS ARCADE</button></div></section>
 <section id="game" class="screen"><header class="hud"><div class="fighter"><div class="avatar"></div><div><div class="name">PLAYER ONE</div><div class="round-score"><b id="pScore">0</b> PTS</div><div class="meter"><i id="pMeter"></i></div></div></div><div class="versus"><div class="inning">INNING <b id="inning">1</b>/3</div><div id="turn" class="turn">YOUR THROW</div></div><div class="fighter cpu"><div><div class="name">THE HOUSE</div><div class="round-score"><b id="cScore">0</b> PTS</div><div class="meter"><i id="cMeter"></i></div></div><div class="avatar"></div></div></header><div id="arena"><canvas id="canvas"></canvas><div id="message" class="message"></div></div><footer class="controls"><div id="instruction" class="instruction">TAP THE BOARD TO AIM</div><div class="control-row"><button id="special" class="special">CLASH<br>MOVE<br><span>0%</span></button><button id="throw" class="throw-box"><i id="power" class="power-fill"></i><span class="throw-label">HOLD<br>FOR POWER</span></button><button id="curve" class="curve">CURVE<strong id="curveValue">0</strong>TAP</button></div></footer></section>
 <section id="results" class="screen"><div id="confetti" class="confetti"></div><div class="cabinet"><div class="kicker">MATCH COMPLETE</div><h2 id="resultTitle" class="result-title">YOU WIN!</h2><p id="resultCopy" class="tag"></p><div class="final-card"><div class="final-grid"><div><b id="finalP">0</b><span>PLAYER</span></div><div><b id="finalC">0</b><span>THE HOUSE</span></div><div><b id="holes">0</b><span>CORNHOLES</span></div><div><b id="rating">A</b><span>RANK</span></div></div></div><button id="again" class="arcade-btn">↻ RUN IT BACK</button><button id="menu" class="arcade-btn secondary">← ARCADE MENU</button></div></section>
 <div class="scan"></div><div class="vignette"></div>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s), canvas=$('#canvas'),ctx=canvas.getContext('2d');
const state={screen:'title',inning:1,turn:'player',bag:0,pScore:0,cScore:0,pRound:0,cRound:0,pMeter:0,cMeter:0,aimX:0,aimY:0,power:.56,curve:0,charging:false,chargeDir:1,special:false,flying:null,bags:[],particles:[],holes:0,locked:false,last:performance.now()};
let W=0,H=0,dpr=1,audio=null;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);if(!state.aimY){state.aimX=W*.5;state.aimY=H*.41}}
new ResizeObserver(resize).observe(canvas);
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');state.screen=id;if(id==='game')setTimeout(resize,0)}
function sound(f=440,d=.08,type='square',v=.025,slide=0){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start();o.stop(t+d+.02)}catch(e){}}
function startGame(){Object.assign(state,{inning:1,turn:'player',bag:0,pScore:0,cScore:0,pRound:0,cRound:0,pMeter:0,cMeter:0,aimX:W*.5,aimY:H*.41,power:.56,curve:0,charging:false,special:false,flying:null,bags:[],particles:[],holes:0,locked:false});show('game');hud();pop('ROUND 1 · FIGHT!');sound(220,.12,'square',.04,440)}
function geometry(){const bw=Math.min(W*.62,360),bh=bw*1.8,cx=W/2,top=H*.24,bottom=Math.min(H*.88,top+bh);return{cx,top,bottom,bw,far:bw*.48,near:bw,holeX:cx,holeY:top+bh*.23,holeR:bw*.09}}
function project(nx,ny){const g=geometry(),t=Math.max(0,Math.min(1,ny)),half=(g.far+(g.near-g.far)*t)/2;return{x:g.cx+nx*half,y:g.top+(g.bottom-g.top)*t}}
function unproject(x,y){const g=geometry(),ny=(y-g.top)/(g.bottom-g.top),half=(g.far+(g.near-g.far)*ny)/2;return{nx:(x-g.cx)/half,ny}}
function draw(){ctx.clearRect(0,0,W,H);drawWorld();drawBoard();drawBags();drawFlying();drawParticles()}
function drawWorld(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#142e58');sky.addColorStop(.52,'#8b4167');sky.addColorStop(.53,'#152d1e');sky.addColorStop(1,'#06120c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd96b';ctx.beginPath();ctx.arc(W*.78,H*.13,28,0,7);ctx.fill();ctx.fillStyle='#0a1710';for(let x=-20;x<W+30;x+=38){ctx.beginPath();ctx.arc(x,H*.5,32,Math.PI,0);ctx.fill()}ctx.fillStyle='#163b27';ctx.fillRect(0,H*.5,W,H*.5);ctx.strokeStyle='#ffffff12';ctx.lineWidth=2;for(let y=H*.55;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+18);ctx.stroke()}ctx.fillStyle='#f3c957';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText('FIRST FRIDAY · LUNA PIER',W/2,H*.07)}
function drawBoard(){const g=geometry(),a=project(-1,0),b=project(1,0),c=project(1,1),d=project(-1,1);ctx.fillStyle='#1d0e08';ctx.beginPath();ctx.moveTo(d.x,d.y+11);ctx.lineTo(c.x,c.y+11);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.fill();let wood=ctx.createLinearGradient(0,g.top,0,g.bottom);wood.addColorStop(0,'#d9a65b');wood.addColorStop(1,'#8c4f24');ctx.fillStyle=wood;ctx.strokeStyle='#f3c957';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#5e331c55';ctx.lineWidth=2;for(let i=.12;i<1;i+=.13){let l=project(-1,i),r=project(1,i);ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(r.x,r.y);ctx.stroke()}ctx.fillStyle='#1b0e0a';ctx.beginPath();ctx.ellipse(g.holeX,g.holeY,g.holeR,g.holeR*.52,0,0,7);ctx.fill();ctx.strokeStyle='#0009';ctx.stroke();ctx.fillStyle='#fff3';ctx.font=`${Math.max(20,g.bw*.1)}px ${getComputedStyle(document.body).fontFamily}`;ctx.textAlign='center';ctx.fillText('GL',g.cx,g.top+(g.bottom-g.top)*.62);if(state.turn==='player'&&!state.flying){ctx.strokeStyle=state.special?'#f3c957':'#28e7ff';ctx.lineWidth=3;ctx.setLineDash([7,7]);ctx.beginPath();ctx.arc(state.aimX,state.aimY,15,0,7);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(state.aimX-22,state.aimY);ctx.lineTo(state.aimX+22,state.aimY);ctx.moveTo(state.aimX,state.aimY-22);ctx.lineTo(state.aimX,state.aimY+22);ctx.stroke()}}
function drawBagAt(x,y,color,rot=0,scale=1){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(scale,scale);ctx.fillStyle='#0006';ctx.fillRect(-13,8,29,8);ctx.fillStyle=color;ctx.strokeStyle='#120c08';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-15,-11,30,23,5);ctx.fill();ctx.stroke();ctx.strokeStyle='#fff4';ctx.strokeRect(-9,-6,18,12);ctx.restore()}
function drawBags(){for(const b of state.bags){if(b.hole)continue;drawBagAt(b.x,b.y,b.owner==='player'?'#00e58b':'#ff4f9a',b.rot,.72)}}
function drawFlying(){let f=state.flying;if(!f)return;let p=f.t,arc=Math.sin(p*Math.PI)*Math.min(H*.35,230),x=f.sx+(f.tx-f.sx)*p+Math.sin(p*Math.PI)*f.curve*55,y=f.sy+(f.ty-f.sy)*p-arc;drawBagAt(x,y,f.owner==='player'?'#00e58b':'#ff4f9a',p*9,.7+Math.sin(p*Math.PI)*.38)}
function drawParticles(){for(const p of state.particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);ctx.globalAlpha=1}}
function particles(x,y,c){for(let i=0;i<26;i++)state.particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-1)*7,life:1,c:c||['#00e58b','#f3c957','#28e7ff','#fff'][i%4],s:3+Math.random()*6})}
function update(dt){if(state.charging){state.power+=state.chargeDir*dt*.00125;if(state.power>=1){state.power=1;state.chargeDir=-1}if(state.power<=.18){state.power=.18;state.chargeDir=1}$('#power').style.height=`${state.power*100}%`}if(state.flying){state.flying.t+=dt/state.flying.duration;if(state.flying.t>=1)land()}for(const p of state.particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=dt/850}state.particles=state.particles.filter(p=>p.life>0)}
function aimAt(e){if(state.turn!=='player'||state.locked||state.flying)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left),y=(e.clientY-r.top),g=geometry();state.aimX=Math.max(g.cx-g.bw*.39,Math.min(g.cx+g.bw*.39,x));state.aimY=Math.max(g.top+20,Math.min(g.bottom-35,y));let u=unproject(state.aimX,state.aimY);state.aimX=project(u.nx,u.ny).x;state.aimY=project(u.nx,u.ny).y;sound(500,.025,'square',.008)}
function beginCharge(e){e.preventDefault();if(state.turn!=='player'||state.locked||state.flying)return;state.charging=true;state.chargeDir=1;sound(180,.05,'square',.015)}
function releaseCharge(e){if(!state.charging)return;e?.preventDefault();state.charging=false;throwBag('player',state.aimX,state.aimY,state.power,state.curve,state.special);state.special=false;$('#special').classList.remove('active')}
function throwBag(owner,tx,ty,power,curve,special=false){state.locked=true;const g=geometry(),ideal=.64,err=(power-ideal)*g.bw*.82;ty+=err;tx+=curve*18;if(special){const dx=g.holeX-tx,dy=g.holeY-ty;tx+=dx*.62;ty+=dy*.62;curve*=1.8}state.flying={owner,sx:W/2,sy:H+24,tx,ty,power,curve,special,t:0,duration:700+Math.abs(power-.6)*220};sound(210,.18,'sawtooth',.025,280)}
function land(){const f=state.flying,g=geometry();let x=f.tx,y=f.ty,dx=(x-g.holeX)/g.holeR,dy=(y-g.holeY)/(g.holeR*.55),hole=Math.hypot(dx,dy)<.82,on=insideBoard(x,y);let points=hole?3:on?1:0;if(f.special&&on&&!hole){for(const b of state.bags.filter(b=>b.owner!==f.owner&&!b.hole)){if(Math.hypot(b.x-x,b.y-y)<55){let u=unproject(b.x,b.y);b.x=project(u.nx+Math.sign(b.x-g.cx)*.55,u.ny+.13).x;b.y=project(u.nx+Math.sign(b.x-g.cx)*.55,u.ny+.13).y;if(!insideBoard(b.x,b.y))b.off=true}}}if(on&&!hole)state.bags.push({owner:f.owner,x,y,rot:Math.random()*1.2-.6,hole:false,points:1});else if(hole)state.bags.push({owner:f.owner,x:g.holeX,y:g.holeY,hole:true,points:3});if(f.owner==='player'){state.pRound+=points;state.pMeter=Math.min(100,state.pMeter+(hole?44:on?22:8));if(hole)state.holes++}else{state.cRound+=points;state.cMeter=Math.min(100,state.cMeter+(hole?42:on?22:8))}particles(x,y,hole?'#f3c957':f.owner==='player'?'#00e58b':'#ff4f9a');pop(hole?'CORNHOLE! +3':on?'ON THE BOARD +1':'AIR MAIL!');sound(hole?920:on?440:110,hole?.25:.13,hole?'square':'sawtooth',.035,hole?500:-50);state.flying=null;hud();setTimeout(nextThrow,900)}
function insideBoard(x,y){let u=unproject(x,y);return u.ny>=0&&u.ny<=1&&Math.abs(u.nx)<=1}
function nextThrow(){state.bag++;if(state.bag>=8){scoreInning();return}state.turn=state.turn==='player'?'cpu':'player';state.locked=false;hud();if(state.turn==='cpu')setTimeout(cpuThrow,620)}
function cpuThrow(){const g=geometry(),skill=.55+state.inning*.08,hit=Math.random()<skill,tx=g.holeX+(Math.random()-.5)*(hit?g.holeR*1.4:g.bw*.65),ty=g.holeY+(Math.random()-.5)*(hit?g.holeR:g.bw*.75),power=.64+(Math.random()-.5)*(hit?.08:.28),curve=(Math.random()-.5)*.8,special=state.cMeter>=100&&Math.random()>.25;if(special){state.cMeter=0;pop('HOUSE SPECIAL!')}throwBag('cpu',tx,ty,power,curve,special);hud()}
function scoreInning(){state.locked=true;let liveP=state.bags.filter(b=>b.owner==='player'&&!b.off).reduce((a,b)=>a+b.points,0),liveC=state.bags.filter(b=>b.owner==='cpu'&&!b.off).reduce((a,b)=>a+b.points,0),net=liveP-liveC;if(net>0)state.pScore+=net;else state.cScore+=-net;hud();pop(net===0?'WASH · NO POINTS':`${net>0?'PLAYER':'HOUSE'} +${Math.abs(net)}`);setTimeout(()=>{if(state.inning>=3||state.pScore>=11||state.cScore>=11)finish();else{state.inning++;state.bag=0;state.pRound=state.cRound=0;state.bags=[];state.turn=state.inning%2?'player':'cpu';state.locked=false;hud();pop(`ROUND ${state.inning} · FIGHT!`);if(state.turn==='cpu')setTimeout(cpuThrow,700)}},1800)}
function finish(){let win=state.pScore>state.cScore;if(state.pScore===state.cScore){state.inning--;state.locked=false;pop('OVERTIME!');setTimeout(()=>{state.inning++;state.bag=0;state.bags=[];state.turn='player';hud()},1100);return}$('#resultTitle').textContent=win?'YOU WIN!':'THE HOUSE WINS';$('#resultCopy').textContent=win?'Luna Pier has a new backyard champion.':'The House talked trash and somehow backed it up.';$('#finalP').textContent=state.pScore;$('#finalC').textContent=state.cScore;$('#holes').textContent=state.holes;let total=Math.round(state.pScore*8000+state.holes*12000+state.pMeter*100);state.finalScore=total;$('#rating').textContent=total>120000?'S':total>80000?'A':total>45000?'B':'C';if(win)makeConfetti();show('results');sound(win?660:130,.4,win?'square':'sawtooth',.05,win?650:-60)}
function pop(t){let m=$('#message');m.textContent=t;m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')}
function hud(){$('#pScore').textContent=state.pScore;$('#cScore').textContent=state.cScore;$('#inning').textContent=Math.min(state.inning,9);$('#pMeter').style.width=state.pMeter+'%';$('#cMeter').style.width=state.cMeter+'%';$('#turn').textContent=state.turn==='player'?'YOUR THROW':'HOUSE THROW';$('#instruction').textContent=state.turn==='player'?(state.special?'SPECIAL ARMED · AIM FOR TROUBLE':'TAP BOARD TO AIM · HOLD THROW'):'THE HOUSE IS AIMING...';let s=$('#special');s.querySelector('span').textContent=Math.floor(state.pMeter)+'%';s.classList.toggle('ready',state.pMeter>=100);$('#curveValue').textContent=state.curve===0?'0':state.curve>0?'RIGHT':'LEFT'}
function useSpecial(){if(state.turn!=='player'||state.locked)return;if(state.pMeter<100){pop('METER NOT READY');sound(100,.12,'sawtooth',.02);return}state.pMeter=0;state.special=true;$('#special').classList.remove('ready');$('#special').classList.add('active');hud();pop('MR. CLEAN SWEEP!');sound(550,.15,'square',.04,400)}
function cycleCurve(){if(state.turn!=='player'||state.locked)return;state.curve=state.curve===0?-1:state.curve<0?1:0;hud();sound(360+state.curve*70,.05,'square',.015)}
function makeConfetti(){let root=$('#confetti');root.innerHTML='';for(let i=0;i<55;i++){let n=document.createElement('i');n.style.cssText=`left:${Math.random()*100}%;--c:${['#00e58b','#f3c957','#28e7ff','#ff4f9a'][i%4]};--d:${2+Math.random()*2}s;--delay:${-Math.random()*3}s;--x:${(Math.random()-.5)*180}px`;root.append(n)}}
function loop(t){let dt=Math.min(33,t-state.last);state.last=t;if(state.screen==='game'){update(dt);draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',aimAt);$('#throw').addEventListener('pointerdown',beginCharge);window.addEventListener('pointerup',releaseCharge);window.addEventListener('pointercancel',releaseCharge);$('#special').onclick=useSpecial;$('#curve').onclick=cycleCurve;$('#start').onclick=startGame;$('#again').onclick=startGame;$('#menu').onclick=()=>location.href=state.finalScore!=null?`/arcade/?score=${state.finalScore}&pilot=${encodeURIComponent('Cornhole Clash')}`:'/arcade/';$('#arcadeBack').onclick=()=>location.href='/arcade/';
window.addEventListener('keydown',e=>{if(state.screen!=='game')return;if(e.code==='Space'){e.preventDefault();if(!state.charging)beginCharge(e)}if(e.key==='ArrowLeft'){state.aimX-=10;state.curve=-1}if(e.key==='ArrowRight'){state.aimX+=10;state.curve=1}if(e.key.toLowerCase()==='s')useSpecial()});window.addEventListener('keyup',e=>{if(e.code==='Space')releaseCharge(e)});
</script>
</body>
