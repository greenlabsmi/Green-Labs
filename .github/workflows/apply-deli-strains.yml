name: Apply Dutch Deli strain update

on:
  push:
    paths:
      - '.github/workflows/apply-deli-strains.yml'

permissions:
  contents: write

jobs:
  patch-deli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Death By Funk and Face Off #1
        shell: python
        run: |
          from pathlib import Path

          # ---- index.html carousel cards ----
          p = Path('index.html')
          s = p.read_text()
          marker = '<div class="deli-card-wrapper" data-category="hybrid" onclick="openDeliModal(\'super-silver-hashplant\')">'
          if "openDeliModal('death-by-funk')" not in s:
              cards = '''<div class="deli-card-wrapper is-award is-new" data-category="indica" onclick="openDeliModal('death-by-funk')">
  <div class="deli-card">
    <div class="deli-card__front" style="background-image: url('https://dutchtouchgenetics.com/assets/img/strains/death-by-funk-bud.jpg');"></div>
    <div class="deli-card__back" style="background-image: url('https://dutchtouchgenetics.com/assets/img/strains/death-by-funk-art.jpg');"></div>
  </div>
  <div class="deli-card__label">
    <h3>Death By Funk</h3>
    <p class="deli-card__genetics">Indica • 26.25% THC • Award Winner</p>
  </div>
</div>

<div class="deli-card-wrapper is-new" data-category="indica" onclick="openDeliModal('face-off-1')">
  <div class="deli-card">
    <div class="deli-card__front" style="background-image: url('https://dutchtouchgenetics.com/assets/img/strains/face-off-og-bud.jpg');"></div>
    <div class="deli-card__back" style="background-image: url('https://dutchtouchgenetics.com/assets/img/strains/face-off-og-art.jpg');"></div>
  </div>
  <div class="deli-card__label">
    <h3>Face Off #1</h3>
    <p class="deli-card__genetics">Indica Dominant • 28.76% THC</p>
  </div>
</div>

'''
              if marker not in s:
                  raise SystemExit('Carousel insertion marker not found')
              s = s.replace(marker, cards + marker, 1)
              p.write_text(s)

          # ---- script.js modal data ----
          p = Path('script.js')
          s = p.read_text()
          marker = '  "super-silver-hashplant": {'
          if '"death-by-funk": {' not in s:
              data = '''  "death-by-funk": {
    name: "Death By Funk",
    tier: "premium",
    seedSource: "Dutch Touch Genetics",
    type: "Indica • 3rd Place Best in Grass",
    thc: "26.25% THC",
    budImage: "https://dutchtouchgenetics.com/assets/img/strains/death-by-funk-bud.jpg",
    artImage: "https://dutchtouchgenetics.com/assets/img/strains/death-by-funk-art.jpg",
    genetics: "Death Star × Clusterfunk",
    terpenes: [
      { name: "β-Caryophyllene", percent: "0.342%", mg: "3.42 mg/g" },
      { name: "Nerolidol", percent: "0.213%", mg: "2.13 mg/g" },
      { name: "α-Humulene", percent: "0.150%", mg: "1.50 mg/g" }
    ],
    about: "🏆 3rd Place Indica Flower — Best in Grass. Deep oil-and-fuel funk with skunky, sour notes and sweet jet-fuel character from Death Star × Clusterfunk."
  },

  "face-off-1": {
    name: "Face Off #1",
    tier: "core",
    seedSource: "Dutch Touch Genetics Library",
    type: "Indica Dominant",
    thc: "28.76% THC",
    budImage: "https://dutchtouchgenetics.com/assets/img/strains/face-off-og-bud.jpg",
    artImage: "https://dutchtouchgenetics.com/assets/img/strains/face-off-og-art.jpg",
    genetics: "Face Off OG #1",
    terpenes: [
      { name: "β-Myrcene", percent: "0.253%", mg: "2.53 mg/g" },
      { name: "Limonene", percent: "0.201%", mg: "2.01 mg/g" },
      { name: "Terpinolene", percent: "0.155%", mg: "1.55 mg/g" }
    ],
    about: "An OG-forward selection with a terpene profile led by myrcene, limonene and terpinolene. This batch tests at 28.76% THC."
  },

'''
              if marker not in s:
                  raise SystemExit('Strain data insertion marker not found')
              s = s.replace(marker, data + marker, 1)
              p.write_text(s)

      - name: Commit changes
        run: |
          git config user.name "Green Labs Site Bot"
          git config user.email "shop@greenlabsmi.com"
          git add index.html script.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Death By Funk and Face Off #1 to Dutch Deli"
          git push origin main
