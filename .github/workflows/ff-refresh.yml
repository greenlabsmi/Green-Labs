name: First Friday refresh

on:
  push:
    paths:
      - ".github/workflows/ff-refresh.yml"
      - "tools/ff_refresh.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refresh
        run: python3 tools/ff_refresh.py
      - name: Commit page update
        run: |
          if git diff --quiet; then
            echo "No page changes needed."
            exit 0
          fi
          git config user.name "Green Labs Site Bot"
          git config user.email "shop@greenlabsmi.com"
          git add firstfriday/index.html
          git commit -m "Refresh First Friday page for September"
          git push
