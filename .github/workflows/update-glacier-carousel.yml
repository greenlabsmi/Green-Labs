name: Update Glacier carousel

on:
  push:
    paths:
      - ".github/workflows/update-glacier-carousel.yml"
      - "tools/update_glacier.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Glacier update
        run: python3 tools/update_glacier.py
      - name: Commit Glacier update
        run: |
          rm .github/workflows/update-glacier-carousel.yml tools/update_glacier.py
          git config user.name "Green Labs Site Bot"
          git config user.email "shop@greenlabsmi.com"
          git add -A script.js .github/workflows/update-glacier-carousel.yml tools/update_glacier.py
          git commit -m "Update Glacier deli carousel"
          git push
