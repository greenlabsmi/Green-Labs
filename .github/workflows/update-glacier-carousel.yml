name: Update Glacier carousel

on:
  push:
    paths:
      - '.github/workflows/update-glacier-carousel.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Glacier curated strains
        shell: python
        run: |
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text()

          old = '''    strains: [
      {
        name: "Blast Chiller",
        thc: "30.7%",
        image: "./assets/img/brands/glacier/blast-chiller-deli.png"
      },
      {
        name: "Green Crack",
        thc: "27%",
        image: "./assets/img/brands/glacier/green-crack-deli.png"
      }
    ]'''

          new = '''    strains: [
      {
        name: "Green Crack",
        thc: "27%",
        image: "./assets/img/brands/glacier/green-crack-deli.png"
      },
      {
        name: "Super Boof",
        image: "./assets/img/brands/glacier/super-boof-deli.png"
      },
      {
        name: "Blueberry Muffin",
        image: "./assets/img/brands/glacier/blueberry-muffin-deli.png"
      },
      {
        name: "Freezer Jam",
        image: "./assets/img/brands/glacier/freezer-jam-deli.png"
      }
    ]'''

          if old not in text:
              raise SystemExit('Expected Glacier strain block was not found; refusing to modify script.js')

          path.write_text(text.replace(old, new, 1))

      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/update-glacier-carousel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows/update-glacier-carousel.yml
          git commit -m "Update Glacier deli carousel"
          git push
